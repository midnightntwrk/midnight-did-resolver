name: "Mount S3"
description: "Mount an S3 bucket to a specified directory"
inputs:
  bucket-name:
    description: "The name of the S3 bucket to mount"
    default: "midnight-s3-fileshare-pre-eu-west-1"
    required: true
  mount-path:
    description: "The directory where the S3 bucket should be mounted"
    required: true
runs:
  using: "composite"
  steps:
    - name: Create mount directory
      run: |
        mkdir -p ${{ inputs.mount-path }}
      shell: bash
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
      with:
        role-to-assume: arn:aws:iam::153331492747:role/MidnightS3FileShareRole
        aws-region: eu-west-1
    - name: Mount S3 bucket
      run: |
        mount-s3 ${{ inputs.bucket-name }} ${{ inputs.mount-path }}
      shell: bash
