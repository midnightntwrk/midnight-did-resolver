name: Push Artifact Public
description: "Push an artifact to a public S3 bucket"
inputs:
  bucket-name:
    description: "The name of the S3 bucket to mount"
    default: "releases.midnight.network"
    required: true
  tag:
    description: 'Provide tag' # example value would be 'compactc-v0.9.2'
    required: true
  release-name:
    description: 'Provide release name' # example value would be 'compactc'
    required: true
  artifact-path:
    description: 'The local path to the artifact'
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
      with:
        role-to-assume: arn:aws:iam::851725512700:role/MidnightS3UploaderRole
        aws-region: eu-west-1

    - name: Upload files to S3
      run: |
        aws s3 cp ${{ github.event.inputs.artifact-path }} s3://${{ github.event.inputs.bucket-name }}/artifacts/${{ github.event.inputs.release-name }}_${{ github.event.inputs.tag }}/
      shell: bash

    - name: Clone releases repository
      run: |
        git clone https://github.com/midnight-ntwrk/releases
      shell: bash

    - name: Create .link files in new branch and create PR
      working-directory: releases
      run: |
        # Set up Git credentials
        git config credential.helper "store --file=.git/credentials"
        echo "https://github.com:${{ secrets.MIDNIGHTBOT_PACKAGES_WRITE }}@github.com" > .git/credentials

        # Create link files
        git checkout -b ${{ github.event.inputs.release-name }}_${{ github.event.inputs.tag }}-branch origin/gh-pages
        cd artifacts

        mkdir -p ${{ github.event.inputs.release-name }}_${{ github.event.inputs.tag }}
        cd ${{ github.event.inputs.release-name }}_${{ github.event.inputs.tag }}

        echo "artifacts/${{ github.event.inputs.release-name }}_${{ github.event.inputs.tag }}/$(basename ${{ github.event.inputs.artifact-path }})" > ${{ github.event.inputs.release-name }}.link

        git add .
        git commit -m "Add link files for ${{ github.event.inputs.release-name }}_${{ github.event.inputs.tag }}"
        git push origin ${{ github.event.inputs.release-name }}_${{ github.event.inputs.tag }}-branch

        export GH_TOKEN="${{ secrets.MIDNIGHTBOT_PACKAGES_WRITE }}"

        gh pr create --base gh-pages --head ${{ github.event.inputs.release-name }}_${{ github.event.inputs.tag }}-branch --title "Add link files for ${{ github.event.inputs.release-name }}_${{ github.event.inputs.tag }}" --body "Approve this PR to release files for ${{ github.event.inputs.release-name }}_${{ github.event.inputs.tag }}"

      shell: bash
