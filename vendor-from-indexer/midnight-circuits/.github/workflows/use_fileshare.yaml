name: Use Fileshare

on:
  workflow_dispatch:

jobs:
  use-fileshare:
    runs-on: [gha-midnight-beefy]
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # Required for actions/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Mount S3
        uses: ./.github/actions/mount-s3
        with:
          bucket-name: midnight-s3-fileshare-pre-eu-west-1
          mount-path: ./s3-fileshare
