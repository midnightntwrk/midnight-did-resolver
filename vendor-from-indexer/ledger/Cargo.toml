[package]
edition = "2021"
name = "midnight-ledger"
version = "4.0.0"
authors = [
  "Thomas Kerber <thomas.kerber@iohk.io>",
  "Mikhail Volkhov <mikhail.volkhov@iohk.io>",
  "Dmitry Voronov <dmitry.voronov@iohk.io>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = false

[features]
default = [
  "transaction-semantics",
  "proof-verifying",
]
fake = [
  "dep:fake",
  "coin-structure/fake",
  "onchain-runtime/fake",
  "zswap/fake",
]
parity-db = [ "coin-structure/parity-db" ]
proof-verifying = [ "zswap/proof-verifying" ]
proving = [
  "proof-verifying",
  "zswap/proving",
  "dep:futures",
]
serde = [
  "dep:serde",
  "coin-structure/serde",
  "onchain-runtime/serde",
  "zswap/serde",
]
sqlite = [ "coin-structure/sqlite" ]
test-utilities = [
  "dep:tokio",
  "zswap/local",
  "dep:reqwest",
]
transaction-construction = [ "zswap/offer-construction" ]
transaction-semantics = [ "verifying" ]
verifying = [ "zswap/verifying" ]

[lib]
name = "midnight_ledger"
path = "src/lib.rs"

[[test]]
name = "composable"
path = "tests/composable.rs"

[[test]]
name = "deserialize"
path = "tests/deserialize.rs"

[[test]]
name = "fallible"
path = "tests/fallible.rs"

[[test]]
name = "maintenance"
path = "tests/maintenance.rs"

[[test]]
name = "malicious_imbalance"
path = "tests/malicious_imbalance.rs"

[[test]]
name = "micro-dao"
path = "tests/micro-dao.rs"

[[test]]
name = "noop-dos"
path = "tests/noop-dos.rs"

[[test]]
name = "semantic-preservation"
path = "tests/semantic-preservation.rs"

[[test]]
name = "simple-merkle-tree"
path = "tests/simple-merkle-tree.rs"

[[test]]
name = "system_tx"
path = "tests/system_tx.rs"

[[bench]]
name              = "benchmarking"
path              = "benches/benchmarking.rs"
harness           = false
required-features = [ "proving" ]

[dependencies]
derive-where         = "^1.2.0"
introspection        = "0.1"
introspection-derive = "0.1"
is_sorted            = "^0.1.1"
lazy_static          = "^1.4.0"
rayon                = "^1.0.0"
sha2                 = "^0.10.0"
tracing              = "^0.1.37"
tracing-subscriber   = "0.3.16"

[dependencies.coin-structure]
git     = "https://github.com/input-output-hk/midnight-ledger-prototype"
tag     = "coin-structure-0.4"
package = "midnight-coin-structure"

[dependencies.fake]
version  = "^2.5.0"
features = [ "derive" ]
optional = true

[dependencies.futures]
version  = "^0.3.26"
optional = true

[dependencies.onchain-runtime]
git     = "https://github.com/input-output-hk/midnight-ledger-prototype"
tag     = "onchain-runtime-0.3"
package = "midnight-onchain-runtime"

[dependencies.rand]
version  = "^0.8.4"
features = [ "getrandom" ]

[dependencies.reqwest]
version          = "^0.11.17"
features         = [ "rustls-tls-native-roots" ]
optional         = true
default-features = false

[dependencies.serde]
version  = "^1.0.0"
features = [ "derive" ]
optional = true

[dependencies.tokio]
version = "^1.28.0"
features = [
  "rt",
  "macros",
]
optional = true

[dependencies.zswap]
path             = "../zswap"
features         = [ "ledger" ]
default-features = false
package          = "midnight-zswap"

[dev-dependencies.coin-structure]
git      = "https://github.com/input-output-hk/midnight-ledger-prototype"
tag      = "coin-structure-0.4"
features = [ "fake" ]
package  = "midnight-coin-structure"

[dev-dependencies.criterion]
version = "^0.5.1"

[dev-dependencies.fake]
version  = "^2.5.0"
features = [ "derive" ]

[dev-dependencies.futures]
version = "^0.3.26"

[dev-dependencies.midnight-ledger]
path = "."
features = [
  "test-utilities",
  "transaction-semantics",
  "transaction-construction",
]

[dev-dependencies.onchain-runtime]
git      = "https://github.com/input-output-hk/midnight-ledger-prototype"
tag      = "onchain-runtime-0.3"
features = [ "fake" ]
package  = "midnight-onchain-runtime"

[dev-dependencies.zswap]
path = "../zswap"
features = [
  "ledger",
  "fake",
  "local",
  "proving",
]
default-features = false
package = "midnight-zswap"
