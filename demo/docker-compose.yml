services:
  proof-server:
    image: '${PROOF_SERVER_IMAGE:-midnightntwrk/proof-server:9.0.2@sha256:787ef99db4b4706eb14d94ad389ca45f1c09bcdf740afecb01899bfbda63dc64}'
    command: ['midnight-proof-server -v']
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/6300 || exit 1
          printf 'GET /version HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r -t 3 status <&3 || exit 1
          [[ "$$status" == "HTTP/1.1 200 "* || "$$status" == "HTTP/1.0 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10s

  node:
    image: '${NODE_IMAGE:-midnightntwrk/midnight-node:2.1.101}'
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
    healthcheck:
      test:
        - CMD-SHELL
        - |
          curl -sf http://localhost:9944/health >/dev/null &&
          curl -sf -H 'Content-Type: application/json' -d '{"id":1,"jsonrpc":"2.0","method":"chain_getHeader","params":[]}' http://localhost:9944 |
          grep -Eq '"number":"0x0*[1-9a-f][0-9a-f]*"'
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s

  indexer:
    image: '${INDEXER_IMAGE:-midnightntwrk/indexer-standalone:4.4.101}'
    env_file:
      - ../infrastructure/standalone.env.example
    environment:
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      # Local-only plaintext default; wss requires an actual TLS-capable node endpoint.
      APP__INFRA__SPO_NODE__URL: '${LOCAL_NODE_WS_SCHEME:-ws}://node:9944'
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  resolver:
    image: '${RESOLVER_IMAGE:-midnight-did-resolver:ledger9-local}'
    build:
      context: ..
      dockerfile: did-resolver-service/Dockerfile
    ports:
      - '127.0.0.1:${RESOLVER_PORT:-3001}:3001'
    environment:
      RESOLVER_HOST: '0.0.0.0'
      RESOLVER_PORT: '3001'
      RESOLVER_ENABLE_DOCS: '${RESOLVER_ENABLE_DOCS:-true}'
      MIDNIGHT_NETWORK: '${MIDNIGHT_NETWORK:-undeployed}'
      MIDNIGHT_INDEXER_HTTP_URL: 'http://indexer:8088/api/v4/graphql'
      # Internal Docker-network WebSocket; TLS terminates at the external boundary.
      MIDNIGHT_INDEXER_WS_URL: '${INDEXER_WS_SCHEME:-ws}://indexer:8088/api/v4/graphql/ws'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      indexer:
        condition: service_healthy

  manager:
    image: '${MANAGER_IMAGE:-midnight-did-manager:ledger9-local}'
    build:
      context: ..
      dockerfile: did-manager-service/Dockerfile
    ports:
      - '127.0.0.1:${MANAGER_PORT:-3010}:3010'
    environment:
      DID_MANAGER_HOST: '0.0.0.0'
      DID_MANAGER_PORT: '3010'
      DID_MANAGER_SETUP: 'standalone'
      DID_MANAGER_DATA_DIR: '/home/node/.midnight-did/manager'
      DID_MANAGER_STANDALONE_INDEXER: 'http://indexer:8088/api/v4/graphql'
      # Internal Docker-network WebSocket; TLS terminates at the external boundary.
      DID_MANAGER_STANDALONE_INDEXER_WS: '${INDEXER_WS_SCHEME:-ws}://indexer:8088/api/v4/graphql/ws'
      DID_MANAGER_STANDALONE_NODE: 'http://node:9944'
      DID_MANAGER_STANDALONE_PROOF_SERVER: 'http://proof-server:6300'
    user: '${MANAGER_CONTAINER_UID:-1000}:${MANAGER_CONTAINER_GID:-1000}'
    volumes:
      - '${MANAGER_DATA_DIR:-${HOME}/.midnight-did/manager}:/home/node/.midnight-did/manager'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3010/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      indexer:
        condition: service_healthy
      node:
        condition: service_healthy
      proof-server:
        condition: service_healthy
