name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: resolver-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Light strict validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run light strict validation
        run: ./run.sh --light --strict

      - name: Build documentation
        run: ./run.sh docs

  e2e:
    name: Service E2E smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build service artifacts
        run: npm run build:all

      - name: Install Playwright browser
        run: npm run playwright:install -w @midnight-ntwrk/midnight-did-manager-service

      - name: Run resolver Docker integration tests
        run: npm run test:integration -w @midnight-ntwrk/midnight-did-resolver-service

      - name: Run manager standalone browser E2E tests
        run: npm run test:e2e:standalone -w @midnight-ntwrk/midnight-did-manager-service

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: service-e2e-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            did-manager-service/playwright-report
            did-manager-service/test-results
            did-resolver-service/test-results

  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run coverage thresholds
        run: npm run coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            secret-storage/coverage
            did-resolver-service/coverage
            did-manager-service/coverage

  docker:
    name: Docker build (${{ matrix.application }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: resolver
            dockerfile: did-resolver-service/Dockerfile
          - application: manager
            dockerfile: did-manager-service/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Validate demo Compose configuration
        run: npm run check:demo

      - name: Build image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: midnight-did-${{ matrix.application }}:ci
