name: Release application Docker images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (defaults to workspace package version)."
        required: false
        default: ""
      platforms:
        description: "Buildx target platforms"
        required: false
        default: "linux/amd64,linux/arm64"

permissions:
  contents: read
  packages: write

env:
  PLATFORMS: "linux/amd64,linux/arm64"

jobs:
  release:
    name: Build and push resolver + manager images
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release metadata
        id: meta
        run: |
          VERSION="${{ github.event.inputs.version }}"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ -z "${VERSION}" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi

          if [[ -z "${VERSION}" ]]; then
            echo "Unable to resolve image version" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          echo "platforms=${{ github.event.inputs.platforms || env.PLATFORMS }}" >> "${GITHUB_OUTPUT}"
          echo "resolver_image=ghcr.io/midnightntwrk/midnight-did-resolver-service:${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "manager_image=ghcr.io/midnightntwrk/midnight-did-manager-service:${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build and push resolver image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: did-resolver-service/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          tags: |
            ${{ steps.meta.outputs.resolver_image }}
            ghcr.io/midnightntwrk/midnight-did-resolver-service:latest
          push: true
          provenance: false

      - name: Build and push manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: did-manager-service/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          tags: |
            ${{ steps.meta.outputs.manager_image }}
            ghcr.io/midnightntwrk/midnight-did-manager-service:latest
          push: true
          provenance: false

      - name: Print image refs
        run: |
          echo "resolver=${{ steps.meta.outputs.resolver_image }}"
          echo "manager=${{ steps.meta.outputs.manager_image }}"
