name: Release application Docker images

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Publication channel (source eligibility is not release approval)"
        required: true
        type: choice
        default: rc
        options: [rc, release]
      version:
        description: "Full image version: X.Y.Z-rc.N for rc, X.Y.Z for release"
        required: true
        type: string
      platforms:
        description: "Buildx target platforms"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string

permissions:
  contents: read

jobs:
  validate-dispatch:
    name: Validate manual publication source
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require exact event, channel and branch ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          [[ "${EVENT_NAME}" == workflow_dispatch && "${REF_TYPE}" == branch ]]
          case "${CHANNEL}:${REF}" in
            rc:refs/heads/develop|rc:refs/heads/main|release:refs/heads/main) ;;
            *) echo "::error::Unsupported publication channel/source ref"; exit 1 ;;
          esac

  release:
    name: Build and push resolver + manager images
    needs: validate-dispatch
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' &&
      ((inputs.channel == 'rc' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
       (inputs.channel == 'release' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      INPUT_CHANNEL: ${{ inputs.channel }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_PLATFORMS: ${{ inputs.platforms }}

    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          # Stdlib-only helper: never restore/save dependency caches in a publishing job.
          package-manager-cache: false

      - name: Resolve and validate publication context
        id: meta
        run: node scripts/release-context.mjs resolve

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Revalidate actual resolver publication inputs
        id: resolver_context
        env:
          RELEASE_CONTEXT: ${{ steps.meta.outputs.context }}
        run: node scripts/release-context.mjs boundary

      - name: Build and push resolver image
        id: build_resolver
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: did-resolver-service/Dockerfile
          platforms: ${{ steps.resolver_context.outputs.platforms }}
          tags: ${{ steps.resolver_context.outputs.resolver_tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.resolver_context.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/midnightntwrk/midnight-did-resolver
            org.opencontainers.image.version=${{ steps.resolver_context.outputs.version }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Revalidate actual manager publication inputs
        id: manager_context
        env:
          RELEASE_CONTEXT: ${{ steps.meta.outputs.context }}
        run: node scripts/release-context.mjs boundary

      - name: Build and push manager image
        id: build_manager
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: did-manager-service/Dockerfile
          platforms: ${{ steps.manager_context.outputs.platforms }}
          tags: ${{ steps.manager_context.outputs.manager_tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.manager_context.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/midnightntwrk/midnight-did-resolver
            org.opencontainers.image.version=${{ steps.manager_context.outputs.version }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.5

      - name: Revalidate and sign published image digests
        env:
          RELEASE_CONTEXT: ${{ steps.meta.outputs.context }}
          RESOLVER_DIGEST: ${{ steps.build_resolver.outputs.digest }}
          MANAGER_DIGEST: ${{ steps.build_manager.outputs.digest }}
        run: node scripts/release-context.mjs sign

      - name: Revalidate and verify published image signatures
        env:
          RELEASE_CONTEXT: ${{ steps.meta.outputs.context }}
          RESOLVER_DIGEST: ${{ steps.build_resolver.outputs.digest }}
          MANAGER_DIGEST: ${{ steps.build_manager.outputs.digest }}
        run: node scripts/release-context.mjs verify

      - name: Print exact source and image digests
        env:
          RELEASE_CONTEXT: ${{ steps.meta.outputs.context }}
          RESOLVER_DIGEST: ${{ steps.build_resolver.outputs.digest }}
          MANAGER_DIGEST: ${{ steps.build_manager.outputs.digest }}
        run: node scripts/release-context.mjs summary
