services:
  proof-server:
    image: "${PROOF_SERVER_IMAGE:-midnightntwrk/proof-server:8.1.3@sha256:0f4ab0716985eaebbe55a970348f52ff05ffd8a96631ed7232bd0c4ba02c115c}"
    command: ["midnight-proof-server", "-v"]
    ports:
      - "0:6300"
    environment:
      RUST_BACKTRACE: "full"

  indexer:
    image: "midnightntwrk/indexer-standalone:4.3.7@sha256:2e2646d03c448dc4611c1117c2395539de6ce11ab9b4e8e3ad56a8779c4b9a19"
    env_file: ../infrastructure/standalone.env.example
    ports:
      - "0:8088"
    environment:
      RUST_LOG: "indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info"
      APP__APPLICATION__NETWORK_ID: "undeployed"
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: "midnightntwrk/midnight-node:0.22.5@sha256:c65b8b80def751580c190ac2e9402fddfcda04bdfb5a6ec83c5cc42bea154dac"
    ports:
      - "0:9944"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s
    environment:
      CFG_PRESET: "dev"
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"

  did-resolver:
    build:
      context: ..
      dockerfile: did-resolver-service/Dockerfile
    environment:
      RESOLVER_HOST: "0.0.0.0"
      RESOLVER_PORT: "3001"
      RESOLVER_DEBUG: "true"
      MIDNIGHT_INDEXER_HTTP_URL: "http://indexer:8088/api/v3/graphql"
      # Local-only default; set LOCAL_INDEXER_WS_SCHEME=wss when TLS is available.
      MIDNIGHT_INDEXER_WS_URL: "${LOCAL_INDEXER_WS_SCHEME:-ws}://indexer:8088/api/v3/graphql/ws"
    ports:
      - "0:3001"
    depends_on:
      indexer:
        condition: service_healthy
