services:
  proof-server:
    image: midnightnetwork/proof-server:4.0.0
    restart: always
    ports:
      - 6300:6300
    environment:
      RUST_BACKTRACE: full
  indexer:
    image: midnightntwrk/indexer-standalone:2.1.4
    restart: always
    ports:
      - 8088:8088
    healthcheck:
      test:
        - CMD-SHELL
        - cat /var/run/indexer-standalone/running
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      RUST_LOG: indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
      APP__INFRA__NODE__URL: ws://node:9944
    depends_on:
      node:
        condition: service_started
  node:
    image: midnightnetwork/midnight-node:0.12.0
    ports:
      - 9944:9944
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9944/health
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      CFG_PRESET: dev
  resolver:
    image: midnight-did-resolver:latest
    restart: always
    ports:
      - 8080:8080
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/api/_system/health
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      MIDNIGHT_INDEXER_URL: indexer:8088/api/v1/graphql
      SERVER_EXTERNAL_URL: http://localhost:8080
    command:
      - serve
    depends_on:
      indexer:
        condition: service_healthy
