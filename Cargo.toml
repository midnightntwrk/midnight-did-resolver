[workspace]
resolver = "3"
members = [
  "midnight-did",
  "midnight-did-indexer-client",
  "midnight-did-resolver",
  "midnight-did-serde",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
midnight-did                = { path = "midnight-did" }
midnight-did-serde          = { path = "midnight-did-serde" }
midnight-did-indexer-client = { path = "midnight-did-indexer-client" }

identus-apollo            = { git = "https://github.com/hyperledger-identus/neoprism", rev = "a5e0c4689012bcc099e69c232475ecc5291b3d8e" }
identus-did-core          = { git = "https://github.com/hyperledger-identus/neoprism", rev = "a5e0c4689012bcc099e69c232475ecc5291b3d8e" }
identus-did-resolver-http = { git = "https://github.com/hyperledger-identus/neoprism", rev = "a5e0c4689012bcc099e69c232475ecc5291b3d8e" }

anyhow             = { version = "1" }
async-trait        = { version = "0.1" }
axum               = { version = "0.8" }
chrono             = { version = "0.4" }
clap               = { version = "4" }
derive_more        = { version = "2" }
graphql_client     = { version = "0.14" }
lazybe             = { version = "0.2" }
reqwest            = { version = "0.12", default-features = false }
serde              = { version = "1" }
serde_json         = { version = "1" }
strum              = { version = "0.27" }
tokio              = { version = "1" }
tower              = { version = "0.5" }
tower-http         = { version = "0.6" }
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
utoipa             = { version = "5" }
utoipa-swagger-ui  = { version = "9" }
